<!DOCTYPE html><html lang="az">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="robots" content="noindex,nofollow">
<title>DigiBaku — İdarəetmə</title>
<link rel="stylesheet" href="/css/admin.css">
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.45.0/dist/umd/supabase.min.js"></script>
</head>
<body>
<div id="loginView" class="login" hidden>
  <form id="loginForm" class="login-card" autocomplete="on">
    <div class="brand"><span class="brand-mark">D</span> DigiBaku <small>İdarəetmə</small></div>
    <label>E-poçt<input id="lEmail" type="email" required autocomplete="username"></label>
    <label>Şifrə<input id="lPass" type="password" required autocomplete="current-password"></label>
    <button class="btn" type="submit">Daxil ol</button>
    <button class="link" type="button" id="forgot">Şifrəni unutmusunuz?</button>
    <p class="msg" id="loginMsg"></p>
  </form>
</div><div id="appView" class="app" hidden>
  <aside class="side">
    <div class="brand"><span class="brand-mark">D</span> DigiBaku</div>
    <nav id="nav"></nav>
    <div class="side-foot">
      <div id="whoami" class="muted small"></div>
      <button class="link" id="logout">Çıxış</button>
    </div>
  </aside>
  <main class="main">
    <header class="head"><h1 id="title"></h1><div id="headActions"></div></header>
    <div id="view"></div>
  </main>
</div><div id="toast" class="toast" role="status" aria-live="polite"></div>
<script type="module" src="/jss/admin.js"></script>
</body>
</html>
