<!DOCTYPE html>
<html lang="az">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>DigiBaku — Premium rəqəmsal xidmətlər</title>
<meta name="description" content="DigiBaku — Netflix, YouTube Premium, ChatGPT, Spotify və digər premium rəqəmsal abunəliklər.">
<meta name="robots" content="index, follow">
<link rel="canonical" href="https://digibaku.com/">
<link rel="icon" href="/assets/img/netflix.webp">
<link rel="stylesheet" href="/css/theme.css">
<link rel="stylesheet" href="/css/home.css">
</head>
<body>
<a class="skip" href="#main">Əsas məzmuna keç</a>

<header class="top">
  <div class="wrap top-row">
    <a class="logo" href="index.html" aria-label="DigiBaku">
      <span class="logo-mark">D</span><span class="logo-text">DigiBaku<b>.com</b></span>
    </a>
    <form class="search" id="searchForm" role="search">
      <input id="search" type="search" maxlength="80" autocomplete="off" placeholder="Məhsul axtar…" aria-label="Məhsul axtar">
    </form>
    <div class="top-actions">
      <div class="langs" role="group" aria-label="Dil">
        <button type="button" data-lang="az">AZ</button><button type="button" data-lang="ru">RU</button><button type="button" data-lang="en">EN</button>
      </div>
      <a class="btn btn-ghost" id="accountBtn" href="login.html">Daxil ol</a>
    </div>
  </div>
  <nav class="cats wrap" id="catNav" aria-label="Kateqoriyalar"></nav>
</header>

<main id="main" class="wrap layout">

  <div class="content">
    <section class="hero" aria-label="Banner">
      <div id="slide"></div>
      <div class="dots" id="dots" hidden></div>
    </section>

    <section class="block" id="catBlock">
      <h2 class="h2" id="catTitle">Nə axtarırsan?</h2>
      <div class="cat-grid" id="catGrid"></div>
    </section>

    <section class="block" id="products">
      <div class="h2-row">
        <h2 class="h2" id="prodTitle">Məhsullar</h2>
        <span class="muted" id="prodCount"></span>
      </div>
      <div class="product-grid" id="productGrid"><p class="muted">Yüklənir…</p></div>
    </section>

    <section class="block" id="reviews" hidden>
      <h2 class="h2" id="revTitle">Müştəri rəyləri</h2>
      <div class="review-grid" id="reviewGrid"></div>
    </section>

    <section class="block" id="faq" hidden>
      <h2 class="h2" id="faqTitle">Tez-tez verilən suallar</h2>
      <div id="faqList"></div>
    </section>
  </div>

  <aside class="cart" id="cart" aria-label="Səbət">
    <div class="cart-head">
      <h2 id="cartTitle">Səbət</h2>
      <span class="badge" id="cartCount">0</span>
      <button class="icon-btn" id="cartClose" type="button" aria-label="Bağla">✕</button>
    </div>
    <div class="cart-list" id="cartList"></div>
    <div class="cart-foot">
      <div class="row"><span id="cartTotalLabel">Ümumi</span><b id="cartTotal">0.00 AZN</b></div>
      <button class="btn btn-primary btn-block" id="checkoutBtn" type="button">Sifarişi təsdiq et</button>
      <p class="muted small" id="cartNote"></p>
    </div>
  </aside>
</main>

<footer class="foot">
  <div class="wrap foot-grid">
    <div>
      <a class="logo" href="index.html"><span class="logo-mark">D</span><span class="logo-text">DigiBaku<b>.com</b></span></a>
      <p class="muted" id="footText"></p>
    </div>
    <div>
      <h3 id="footInfoTitle">Məlumat</h3>
      <button class="link" type="button" data-page="about_text" id="linkAbout">Haqqımızda</button>
      <a class="link" href="faq.html">FAQ</a>
      <button class="link" type="button" data-page="terms_text" id="linkTerms">Şərtlər və qaydalar</button>
      <button class="link" type="button" data-page="privacy_text" id="linkPrivacy">Məxfilik siyasəti</button>
      <a class="link" href="qiymetler.html" id="linkPrices">Qiymətlər</a>
    </div>
    <div>
      <h3 id="footContactTitle">Əlaqə</h3>
      <p class="muted" id="footEmail"></p>
      <p class="muted" id="footPhone"></p>
      <p class="muted" id="footAddress"></p>
      <a class="wa-link" id="footWa" href="#" target="_blank" rel="noopener" hidden>WhatsApp ilə yazın</a>
      <a class="link" href="chat.html" id="footChat">Canlı çat</a>
    </div>
  </div>
  <div class="wrap copy">© <span id="year"></span> DigiBaku.com</div>
</footer>

<nav class="bottom-nav" aria-label="Mobil menyu">
  <a href="index.html" class="on"><span id="bnHomeT">Ana səhifə</span></a>
  <a href="#products"><span id="bnProductsT">Məhsullar</span></a>
  <button type="button" id="bnCart"><span id="bnCartT">Səbət</span> <span class="badge" id="bnCount">0</span></button>
  <a href="login.html" id="bnProfile"><span id="bnProfileT">Profil</span></a>
</nav>

<a class="wa-float" id="waFloat" href="#" target="_blank" rel="noopener" hidden aria-label="WhatsApp ilə yazın">
  <svg viewBox="0 0 32 32" aria-hidden="true"><path d="M16.002 0c-8.837 0-16 7.163-16 16 0 2.825.736 5.485 2.025 7.795l-2.025 7.395 7.575-1.985c2.22 1.21 4.795 1.9 7.425 1.9 8.837 0 16-7.163 16-16s-7.163-16-16-16zM16.002 29.337c-2.345 0-4.57-.63-6.505-1.725l-.465-.27-4.83 1.265 1.29-4.705-.3-.485c-1.215-1.95-1.855-4.22-1.855-6.557 0-7.36 5.99-13.35 13.35-13.35 7.36 0 13.35 5.99 13.35 13.35s-5.99 13.35-13.35 13.35z"/></svg>
</a>

<aside class="drawer" id="pageDrawer" hidden aria-label="Məlumat">
  <div class="cart-head">
    <h2 id="pageTitle"></h2>
    <button class="icon-btn" id="pageClose" type="button" aria-label="Bağla">✕</button>
  </div>
  <div class="page-body" id="pageBody"></div>
</aside>
<div class="scrim" id="scrim" hidden></div>

<script src="/js/home.js" type="module"></script>
</body>
</html>
