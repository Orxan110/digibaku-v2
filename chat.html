<!doctype html>
<html lang="az">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Çat — DigiBaku</title>
<meta name="description" content="DigiBaku ilə birbaşa çat: sualınızı yazın, tez cavab verək.">
<link rel="stylesheet" href="assets/style.css">
</head>
<body data-page="chat">
<div id="site-header"></div>

<main class="wrap chat-wrap">
  <h1 class="sr-only">Çat</h1>
  <div class="chatbox" id="chat">
    <div class="chat-head">
      <div class="chat-av" aria-hidden="true">D</div>
      <div class="chat-ht"><b id="chatTitle">DigiBaku</b><span id="chatSub"></span></div>
      <a class="chat-wa" id="chatWa" href="#" target="_blank" rel="noopener" hidden>WhatsApp</a>
      <button type="button" class="chat-new" id="chatNew" aria-label="Yeni söhbət" title="Yeni söhbət">↺</button>
    </div>

    <div class="chat-msgs" id="chatMsgs" role="log" aria-live="polite"></div>

    <div class="chat-quick" id="chatQuick"></div>

    <div class="chat-foot">
      <input id="chatName" class="chat-name" maxlength="60" autocomplete="name">
      <div class="chat-row">
        <textarea id="chatText" rows="1" maxlength="1000"></textarea>
        <button id="chatSend" class="chat-send" type="button" aria-label="Göndər">
          <svg viewBox="0 0 24 24" aria-hidden="true" focusable="false"><path fill="currentColor" d="M3.4 20.4 21 12 3.4 3.6 3.3 10l12.6 2-12.6 2z"/></svg>
        </button>
      </div>
      <div id="chatErr" class="err chat-err" role="alert"></div>
    </div>
  </div>
</main>

<footer class="wrap">
  <a href="about.html">Haqqımızda</a><a href="faq.html">FAQ</a><a href="contact.html">Əlaqə</a>
  <a href="rules.html">Sifariş və xidmət qaydaları</a><a href="privacy.html">Məxfilik siyasəti</a><a href="terms.html">İstifadə şərtləri</a>
  <p style="margin-top:10px">© DigiBaku</p>
</footer>

<nav id="bottom-nav"></nav>

<script src="assets/auth.js"></script>
<script src="assets/api.js"></script>
<script src="assets/app.js"></script>
<script src="assets/chat-render.js"></script>
<script src="assets/chat.js"></script>
</body>
</html>
