<!doctype html>
<html lang="az">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Çat — DigiBaku</title>
<meta name="description" content="DigiBaku ilə birbaşa çat: sualınızı yazın, tez cavab verək.">
<link rel="stylesheet" href="assets/style.css">
</head>
<body data-page="chat">
<div id="site-header"></div>

<main class="wrap" style="padding-bottom:110px">
  <h1 style="margin:20px 0 12px;font-size:24px">Çat</h1>
  <div class="card-box">
    <div id="chatMsgs" style="height:46vh;min-height:260px;overflow-y:auto;padding-right:4px"></div>
    <input id="chatName" maxlength="60" style="width:100%;padding:12px;margin-top:12px;border-radius:12px;border:1px solid #262626;background:#1a1a1a;color:#f5f5f5;box-sizing:border-box;font-size:16px">
    <div style="display:flex;gap:8px;margin-top:8px">
      <textarea id="chatText" rows="2" maxlength="1000" style="flex:1;padding:12px;border-radius:12px;border:1px solid #262626;background:#1a1a1a;color:#f5f5f5;box-sizing:border-box;font-size:16px;resize:none"></textarea>
      <button id="chatSend" class="btn gold" type="button">Göndər</button>
    </div>
    <div id="chatErr" class="err" style="min-height:18px;margin-top:6px"></div>
  </div>
</main>

</footer>

<div id="fabs"></div>
<nav id="bottom-nav"></nav>

<script src="assets/chat.js"></script>
</body>
</html>
