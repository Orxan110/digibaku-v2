<!doctype html>
<html lang="az">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Giriş / Qeydiyyat — DigiBaku</title>
<meta name="description" content="DigiBaku — premium rəqəmsal xidmətlər">

</head>
<body>
<div id="site-header"></div>
<main class="wrap">

<div class="card-box" style="max-width:420px;margin:24px auto">
  <div style="display:flex;gap:8px;margin-bottom:16px">
    <button class="btn gold" id="tabLogin" style="flex:1">Daxil ol</button>
    <button class="btn" id="tabRegister" style="flex:1">Qeydiyyat</button>
  </div>
  <form id="authForm" novalidate>
    <div class="field" id="nameField" style="display:none"><label for="name">Ad</label><input id="name" autocomplete="name"></div>
    <div class="field"><label for="email">E-poçt</label><input id="email" type="email" autocomplete="email" required></div>
    <div class="field"><label for="password">Şifrə</label><input id="password" type="password" autocomplete="current-password" required></div>
    <div class="err" id="authErr"></div><div class="ok" id="authOk"></div>
    <button class="btn gold" type="submit" id="authBtn" style="width:100%">Daxil ol</button>
  </form>
  <p style="margin-top:12px;text-align:center"><a class="muted" href="#" id="forgot">Şifrəni unutdunuz?</a></p>
</div>

</main>
