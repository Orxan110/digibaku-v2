<!doctype html>
<html lang="az">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Məhsul — DigiBaku</title>
<meta name="description" content="DigiBaku məhsul detalları, müddət seçimi və qiymətlər.">
<link rel="stylesheet" href="assets/style.css">
<style>
  .pd-wrap{padding-bottom:150px}
  @media(max-width:899px){.pd-wrap{padding-right:76px}}
  .pd-grid{display:grid;gap:14px;margin:20px 0}
  @media(min-width:900px){.pd-grid{grid-template-columns:1fr 1fr;align-items:start}}
  .pd-img{aspect-ratio:16/10;background:var(--card2);border:1px solid var(--line);border-radius:var(--r);display:flex;align-items:center;justify-content:center;overflow:hidden;color:var(--muted);text-align:center;padding:12px}
  .pd-img img{width:100%;height:100%;object-fit:cover}
  .pd-title{font-size:clamp(22px,4vw,30px);line-height:1.2;margin-bottom:8px}
  .pd-desc{color:var(--muted);margin-bottom:14px}
  .pd-feats{margin:0 0 16px 18px;color:var(--muted)}
  .pd-label{font-size:14px;color:var(--muted);margin:14px 0 8px}
  .pd-opts{display:flex;gap:8px;flex-wrap:wrap}
  .pd-opt{border:1px solid var(--line);background:var(--card);color:var(--text);border-radius:12px;padding:10px 14px;cursor:pointer;text-align:left;min-width:92px}
  .pd-opt.on{border-color:var(--gold);background:var(--card2)}
  .pd-opt small{display:block;color:var(--muted);font-size:12px}
  .pd-opt .old{text-decoration:line-through;color:var(--muted);font-size:12px;margin-right:4px}
  .pd-opt .now{color:var(--gold);font-weight:700}
  .pd-note{font-size:13px;color:var(--muted);margin-top:12px}
  .sticky-bar{position:fixed;left:0;right:0;bottom:calc(64px + env(safe-area-inset-bottom));z-index:65;background:rgba(0,0,0,.96);border-top:1px solid var(--gold);padding:10px 14px calc(10px + env(safe-area-inset-bottom));}
  .sticky-inner{max-width:1100px;margin:0 auto;display:flex;gap:10px;align-items:center;justify-content:space-between;flex-wrap:wrap}
  .sticky-price{font-size:14px;color:var(--muted)}
  .sticky-price b{display:block;color:var(--gold);font-size:18px}
  .sticky-actions{display:flex;gap:8px;flex-wrap:wrap}
  @media(min-width:900px){.sticky-bar{bottom:0}}
</style>
</head>
<body>
<div id="site-header"></div>

<main class="wrap pd-wrap">
  <div id="pdBox"><div class="empty">Yüklənir...</div></div>
</main>

<footer class="wrap">
  <a href="about.html">Haqqımızda</a><a href="faq.html">FAQ</a><a href="contact.html">Əlaqə</a>
  <a href="rules.html">Sifariş və xidmət qaydaları</a><a href="privacy.html">Məxfilik siyasəti</a><a href="terms.html">İstifadə şərtləri</a>
  <p style="margin-top:10px">© DigiBaku</p>
</footer>

<div id="stickyBar" class="sticky-bar" style="display:none"></div>
<div id="fabs"></div>
<nav id="bottom-nav"></nav>

<script src="assets/auth.js"></script>
<script src="assets/api.js"></script>
<script src="assets/app.js"></script>
<script src="assets/product.js"></script>
<script src="assets/product-faq.js"></script>
</body>
</html>
