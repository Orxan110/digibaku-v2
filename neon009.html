<!doctype html>
<html lang="az">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex,nofollow,noarchive">
<title>Giriş</title>
<link rel="icon" href="/assets/favicon.svg" type="image/svg+xml">
<link rel="stylesheet" href="assets/style.css">
<script src="assets/admin-theme.js"></script>
<style>
  .ad-layout{display:grid;grid-template-columns:230px 1fr;min-height:100vh}
  .ad-side{background:#0c0c0c;border-right:1px solid #262626;padding:18px 12px;position:sticky;top:0;height:100vh;overflow-y:auto}
  .ad-brand{color:var(--gold);font-weight:800;font-size:18px;margin:0 8px 18px}
  .ad-link{display:block;padding:11px 12px;border-radius:10px;color:#f5f5f5;font-size:15px;margin-bottom:4px;cursor:pointer;border:0;background:none;text-align:left;width:100%}
  .ad-link:hover{background:#1a1a1a}
  .ad-link.on{background:var(--gold);color:var(--on-gold,#000);font-weight:700}
  .ad-link.dis{color:#6b6b6b;cursor:default}
  .ad-link.dis:hover{background:none}
  .ad-main{padding:16px 18px;min-width:0}
  .ad-top{display:flex;align-items:center;gap:12px;margin-bottom:14px}
  .ad-top h1{font-size:22px;margin:0}
  .ad-burger{display:none;width:42px;height:42px;border-radius:10px;border:1px solid #262626;background:#111;color:#f5f5f5;font-size:20px;cursor:pointer}
  .ad-out{margin-top:18px;color:#f87171}
  .lg-card{width:100%;max-width:380px;margin:0 auto;background:#111;border:1px solid #262626;border-radius:16px;padding:26px 22px}
  .lg-logo{color:var(--gold);font-weight:800;font-size:24px;text-align:center;margin-bottom:14px}
  .lg-h{font-size:18px;margin:0 0 16px;text-align:center}
  .lg-l{display:block;font-size:12px;color:#a3a3a3;margin:12px 0 6px}
  .lg-i{width:100%;padding:12px;border-radius:10px;border:1px solid #262626;background:#1a1a1a;color:#f5f5f5;box-sizing:border-box;font-size:16px;outline:none}
  .lg-i:focus{border-color:var(--gold)}
  body.locked .ad-layout{display:flex;align-items:center;justify-content:center;padding:20px}
  body.locked .ad-side,body.locked .ad-top{display:none}
  body.locked .ad-main{width:100%;padding:0}
  body.locked #list{display:none}
  @media(max-width:860px){
    .ad-layout{grid-template-columns:1fr}
    .ad-side{position:fixed;left:0;top:0;width:250px;height:100vh;z-index:50;transform:translateX(-100%);transition:transform .2s}
    .ad-side.open{transform:none;box-shadow:0 0 30px rgba(0,0,0,.6)}
    .ad-burger{display:inline-block}
  }
</style>
</head>
<body class="locked">
<div class="ad-layout">
  <aside class="ad-side" id="side">
    <div class="ad-brand">DigiBaku Admin</div>
    <nav id="nav">
      <button class="ad-link" data-sec="orders">Sifarişlər</button>
      <button class="ad-link" data-sec="products">Məhsullar</button>
      <button class="ad-link" data-sec="categories">Kateqoriyalar</button>
      <button class="ad-link" data-sec="faq">FAQ</button>
      <button class="ad-link" data-sec="content">Məhsul məzmunu</button>
      <button class="ad-link" data-sec="banners">Bannerlər</button>
      <button class="ad-link" data-sec="customers">Müştərilər</button>
      <button class="ad-link" data-sec="coupons">Kuponlar</button>
      <button class="ad-link" data-sec="discounts">Planlı endirim</button>
      <button class="ad-link" data-sec="reminders">Abunə xatırlatması</button>
      <button class="ad-link" data-sec="visits">Ziyarətçilər</button>
      <button class="ad-link" data-sec="bans">IP banları</button>
      <button class="ad-link" data-sec="cashback">Keşbek</button>
      <button class="ad-link" data-sec="chat">Çat</button>
      <button class="ad-link" data-sec="reviews">Rəylər</button>
      <button class="ad-link" data-sec="pages">Səhifələr</button>
      <button class="ad-link" data-sec="seo">SEO</button>
      <button class="ad-link" data-sec="stats">Statistika</button>
      <button class="ad-link" data-sec="settings">Sayt parametrləri</button>
            <button class="ad-link" data-sec="tools">Alətlər</button>
    </nav>
    <button class="ad-link ad-out" id="logoutBtn" style="display:none">Çıxış</button>
  </aside>

  <section class="ad-main">
    <div class="ad-top">
      <button class="ad-burger" id="menuBtn" aria-label="Menyu">☰</button>
      <h1 id="secTitle">Admin</h1>
    </div>

    <div id="login" class="lg-card" style="display:none">
      <div class="lg-logo">DigiBaku</div>
      <h2 class="lg-h">Hesaba daxil olun</h2>
      <label for="em" class="lg-l">E-POÇT</label>
      <input id="em" type="email" autocomplete="username" placeholder="E-poçtunuzu daxil edin" class="lg-i">
      <label for="pw" class="lg-l">ŞİFRƏ</label>
      <input id="pw" type="password" autocomplete="current-password" placeholder="Şifrənizi daxil edin" class="lg-i">
      <button id="loginBtn" class="btn gold" style="width:100%;margin-top:6px">Daxil ol</button>
    </div>

    <div id="msg" class="err" style="text-align:center;max-width:380px;margin:12px auto"></div>
    <div id="list"><div class="empty">Yüklənir...</div></div>
  </section>
</div>
<script src="assets/admin-core.js"></script>
<script src="assets/admin-cat-faq.js"></script>
<script src="assets/admin-faq.js"></script>
<script src="assets/admin-content.js"></script>
<script src="assets/admin-banners.js"></script>
<script src="assets/admin-customers.js"></script>
<script src="assets/admin-coupons.js"></script>
<script src="assets/admin-discounts.js"></script>
<script src="assets/admin-reminders.js"></script>
<script src="assets/admin-visits.js"></script>
<script src="assets/admin-bans.js"></script>
<script src="assets/admin-cashback.js"></script>
<script src="assets/admin-reviews.js"></script>
<script src="assets/admin-stats.js"></script>
<script src="assets/admin-settings.js"></script>
<script src="assets/admin-pages.js"></script>
<script src="assets/admin-seo.js"></script>
<script src="assets/admin-extra.js"></script>
<script src="assets/admin-plus.js?v=4"></script>
<script src="assets/chat-render.js"></script>
<script src="assets/admin-chat.js"></script>
</body>
</html>
